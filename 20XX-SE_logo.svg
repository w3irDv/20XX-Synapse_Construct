<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -148 792 771" width="1584" height="1542" role="img" aria-label="20XX Synapse Engine (v6, large base logos and labels around the badge): the 20XX Hack Pack AI connected to vanilla, m-ex, ACE and hybrid.64">
  <title>20XX Synapse Engine</title>
  <defs>
    <!-- chrome lettering, as on the 20XX Hack Pack badge -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#d6dee8"/>
      <stop offset="0.5" stop-color="#7e8a9b"/>
      <stop offset="0.62" stop-color="#c3ccd8"/>
      <stop offset="1" stop-color="#f2f5f9"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3e44"/>
      <stop offset="1" stop-color="#1c1e22"/>
    </linearGradient>
    <linearGradient id="axon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8bff"/>
      <stop offset="1" stop-color="#9fd6ff"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#2f8bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    <clipPath id="badgeclip">
      <polygon points="240,92 368,166 368,314 240,388 112,314 112,166"/>
    </clipPath>
    <!-- VANILLA node art -->
    <radialGradient id="smashRed" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ff3a2a"/>
      <stop offset="1" stop-color="#c40e06"/>
    </radialGradient>
    <clipPath id="smashClip"><circle r="16.5"/></clipPath>
    <linearGradient id="meleeMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14142a"/>
      <stop offset="0.55" stop-color="#3a2f6e"/>
      <stop offset="1" stop-color="#b9a6ff"/>
    </linearGradient>
    <!-- HYBRID.64 node art -->
    <radialGradient id="h64Fire" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.35" stop-color="#ffb020"/>
      <stop offset="0.7" stop-color="#ff5a0a"/>
      <stop offset="1" stop-color="#a01204"/>
    </radialGradient>
    <!-- ACE node art: the Smash emblem over a neon grid disc -->
    <clipPath id="aceClip"><circle r="18.6"/></clipPath>
    <radialGradient id="aceBlue" cx="0.25" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#4a63ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4a63ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aceMagenta" cx="0.85" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ff3fb4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3fb4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aceTeal" cx="0.15" cy="0.62" r="0.4">
      <stop offset="0" stop-color="#2fd6b0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2fd6b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="acePink" cx="0.55" cy="0.95" r="0.4">
      <stop offset="0" stop-color="#ff5a8c" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff5a8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aceEmblem" gradientUnits="userSpaceOnUse" x1="0" y1="-13" x2="0" y2="13">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.45" stop-color="#1e0204"/>
      <stop offset="1" stop-color="#d0120c"/>
    </linearGradient>
    <!-- a base node: small hexagon -->
    <symbol id="node" viewBox="-20 -20 40 40" overflow="visible">
      <polygon points="0,-17 14.7,-8.5 14.7,8.5 0,17 -14.7,8.5 -14.7,-8.5" fill="#1c1e22" stroke="#2f8bff" stroke-width="3.2"/>
      <polygon points="0,-17 14.7,-8.5 14.7,8.5 0,17 -14.7,8.5 -14.7,-8.5" fill="none" stroke="#cfeaff" stroke-width="0.9"/>
      <circle r="4" fill="#ffffff"/>
    </symbol>
  </defs>

  <!-- ============ axons: the 20XX neuron reaching each base (behind the badge) ============ -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <g stroke="url(#axon)" stroke-width="3">
      <path d="M207 226 C178.9 158.8 97.8 142.7 59.9 89"/>
      <path d="M207 226 C282.6 179.3 379.4 187.7 456.2 154.4"/>
      <path d="M207 226 C175.4 294.5 113.3 346.8 76.7 409.1"/>
      <path d="M207 226 C280.5 294.9 386.6 320.5 463.7 377.5"/>
    </g>
    <g stroke="#cfeaff" stroke-width="0.9" opacity="0.9">
      <path d="M207 226 C178.9 158.8 97.8 142.7 59.9 89"/>
      <path d="M207 226 C282.6 179.3 379.4 187.7 456.2 154.4"/>
      <path d="M207 226 C175.4 294.5 113.3 346.8 76.7 409.1"/>
      <path d="M207 226 C280.5 294.9 386.6 320.5 463.7 377.5"/>
    </g>
  </g>

  <!-- ============ the badge (the 20XX Hack Pack hexagon) ============ -->
  <polygon points="240,80 378,160 378,320 240,400 102,320 102,160" fill="url(#badge)"/>
  <!-- inner light rail, open on the lower left as on the original badge -->
  <polyline points="128,303 128,175 240,110 352,175 352,305 240,370 180,335"
            fill="none" stroke="#5d626b" stroke-width="7" stroke-linejoin="miter"/>
  <polyline points="128,303 128,175 240,110 352,175 352,305 240,370 180,335"
            fill="none" stroke="#8a919c" stroke-width="1.2" stroke-linejoin="miter"/>

  <!-- faint machine code behind, like the original -->
  <g clip-path="url(#badgeclip)" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#9fb4c8" opacity="0.14">
    <text x="150" y="140">7F 49 3C 00 1A</text>
    <text x="146" y="158">80 6B 00 8C E4</text>
    <text x="150" y="322">C2 25 BB 6C 00</text>
    <text x="160" y="340">0A 4B 00 77 1F</text>
    <text x="196" y="358">00 10 E9</text>
  </g>

  <!-- axons visible again across the badge face, dimmer -->
  <g fill="none" stroke="#4aa3ff" stroke-width="1.6" stroke-linecap="round" opacity="0.55" filter="url(#glow)">
    <path d="M207 226 C178.9 158.8 97.8 142.7 59.9 89"/>
    <path d="M207 226 C282.6 179.3 379.4 187.7 456.2 154.4"/>
    <path d="M207 226 C175.4 294.5 113.3 346.8 76.7 409.1"/>
    <path d="M207 226 C280.5 294.9 386.6 320.5 463.7 377.5"/>
  </g>

  <!-- ============ 20XX: chrome letters, the 0 is the neuron ============ -->
  <g font-family="Impact, 'Arial Black', 'Haettenschweiler', sans-serif" font-size="92" text-anchor="middle"
     fill="url(#chrome)" stroke="#4f5764" stroke-width="1.4" filter="url(#shadow)">
    <text x="150" y="261">2</text>
    <text x="272" y="261">X</text>
    <text x="334" y="261">X</text>
  </g>
  <g filter="url(#bigglow)">
    <polygon points="207,190 238.2,208 238.2,244 207,262 175.8,244 175.8,208" fill="none" stroke="#2f7fe8" stroke-width="13"/>
  </g>
  <g filter="url(#glow)">
    <polygon points="207,190 238.2,208 238.2,244 207,262 175.8,244 175.8,208" fill="none" stroke="#7cc2ff" stroke-width="6"/>
    <polygon points="207,190 238.2,208 238.2,244 207,262 175.8,244 175.8,208" fill="none" stroke="#e4f4ff" stroke-width="1.6"/>
    <!-- nucleus + dendrites inside the 0 -->
    <g stroke="#cfeaff" stroke-width="1.6" stroke-linecap="round">
      <path d="M207 226 L207 199 M207 226 L230 213 M207 226 L230 239 M207 226 L207 253 M207 226 L184 239 M207 226 L184 213"/>
    </g>
    <circle cx="207" cy="226" r="7" fill="#ffffff"/>
  </g>
  <!-- the star glint on the 0, as on the original -->
  <g filter="url(#glow)">
    <circle cx="186" cy="196" r="15" fill="url(#spark)"/>
    <path d="M186 172 L188.4 193.6 L210 196 L188.4 198.4 L186 220 L183.6 198.4 L162 196 L183.6 193.6 Z" fill="#ffffff"/>
  </g>

  <!-- ============ title ============ -->
  <g font-family="Impact, 'Arial Black', sans-serif" text-anchor="middle" filter="url(#shadow)">
    <text x="240" y="302" font-size="34" letter-spacing="5" fill="url(#chrome)" stroke="#4f5764" stroke-width="0.8">SYNAPSE</text>
    <text x="240" y="326" font-size="16" letter-spacing="11" fill="#8fd0ff">ENGINE</text>
  </g>

  <!-- ============ the synapses: axon bulb, gap (spark), base node ============ -->
  <!-- synapses: axon end bulb, then the gap firing (spark), then the base -->
  <g filter="url(#glow)"><!-- VANILLA -->
    <circle cx="59.9" cy="89" r="8" fill="#7cc2ff"/>
    <circle cx="48.2" cy="78.1" r="9.5" fill="url(#spark)"/>
    <circle cx="45.1" cy="79.9" r="2" fill="#fff"/><circle cx="50.9" cy="75.1" r="1.6" fill="#fff"/><circle cx="50" cy="80.5" r="1.4" fill="#fff"/>
  </g>
  <g filter="url(#glow)"><!-- M-EX -->
    <circle cx="456.2" cy="154.4" r="8" fill="#7cc2ff"/>
    <circle cx="471.5" cy="150" r="9.5" fill="url(#spark)"/>
    <circle cx="471.5" cy="146.3" r="2" fill="#fff"/><circle cx="472.6" cy="153.8" r="1.6" fill="#fff"/><circle cx="468.5" cy="150.3" r="1.4" fill="#fff"/>
  </g>
  <g filter="url(#glow)"><!-- ACE -->
    <circle cx="76.7" cy="409.1" r="8" fill="#7cc2ff"/>
    <circle cx="67.4" cy="422.1" r="9.5" fill="url(#spark)"/>
    <circle cx="69.7" cy="424.9" r="2" fill="#fff"/><circle cx="64.2" cy="419.8" r="1.6" fill="#fff"/><circle cx="69.6" cy="419.9" r="1.4" fill="#fff"/>
  </g>
  <g filter="url(#glow)"><!-- HYBRID.64 -->
    <circle cx="463.7" cy="377.5" r="8" fill="#7cc2ff"/>
    <circle cx="477.4" cy="385.6" r="9.5" fill="url(#spark)"/>
    <circle cx="480.1" cy="383.1" r="2" fill="#fff"/><circle cx="475.4" cy="389.1" r="1.6" fill="#fff"/><circle cx="475.1" cy="383.7" r="1.4" fill="#fff"/>
  </g>
  <!-- VANILLA node: the Smash Bros. emblem (red, white bars) -->
  <g transform="translate(-12 22) scale(3.5)" filter="url(#glow)">
    <circle r="19.5" fill="#1c1e22" stroke="#2f8bff" stroke-width="1.4"/>
    <circle r="16.5" fill="url(#smashRed)"/>
    <g fill="#ffffff" clip-path="url(#smashClip)">
      <rect x="-10.2" y="-17" width="3.2" height="34"/>
      <rect x="-17" y="2.2" width="34" height="3.2"/>
    </g>
  </g>
  <!-- M-EX node: the Akaneia shield (green, dark down-triangle) -->
  <g transform="translate(548 128) scale(3.5)" filter="url(#glow)">
    <path d="M-18,-15 L0,-21 L18,-15 L18,1 C18,12 9,18 0,22 C-9,18 -18,12 -18,1 Z" fill="#41d96f" stroke="#1c1e22" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M-8.5,-6 L8.5,-6 L0,7.5 Z" fill="#1c1e22" stroke="#1c1e22" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <!-- ACE node: the Smash emblem (black-to-red, silver rim) over a neon grid disc -->
  <g transform="translate(12 500) scale(3.5)" filter="url(#glow)">
    <circle r="19.5" fill="#14123a" stroke="#2f8bff" stroke-width="1.4"/>
    <g clip-path="url(#aceClip)">
      <rect x="-19" y="-19" width="38" height="38" fill="url(#aceBlue)"/>
      <rect x="-19" y="-19" width="38" height="38" fill="url(#aceMagenta)"/>
      <rect x="-19" y="-19" width="38" height="38" fill="url(#aceTeal)"/>
      <rect x="-19" y="-19" width="38" height="38" fill="url(#acePink)"/>
      <path d="M-18 -19 V19 M-15 -19 V19 M-12 -19 V19 M-9 -19 V19 M-6 -19 V19 M-3 -19 V19 M0 -19 V19 M3 -19 V19 M6 -19 V19 M9 -19 V19 M12 -19 V19 M15 -19 V19 M18 -19 V19 M-19 -18 H19 M-19 -15 H19 M-19 -12 H19 M-19 -9 H19 M-19 -6 H19 M-19 -3 H19 M-19 0 H19 M-19 3 H19 M-19 6 H19 M-19 9 H19 M-19 12 H19 M-19 15 H19 M-19 18 H19" stroke="#9db0ff" stroke-width="0.25" opacity="0.45" fill="none"/>
    </g>
    <circle r="18.6" fill="none" stroke="url(#chrome)" stroke-width="1.3"/>
    <g fill="url(#aceEmblem)" stroke="#e6ebf2" stroke-width="0.9" stroke-linejoin="round">
      <path d="M-5.6,-11.73 L-5.6,3 L-12.65,3 A13,13 0 0 1 -5.6,-11.73 Z"/>
      <path d="M-3.2,-12.6 A13,13 0 0 1 12.65,3 L-3.2,3 Z"/>
      <path d="M-11.83,5.4 L-5.6,5.4 L-5.6,11.73 A13,13 0 0 1 -11.83,5.4 Z"/>
      <path d="M-3.2,5.4 L11.83,5.4 A13,13 0 0 1 -3.2,12.6 Z"/>
    </g>
  </g>
  <!-- HYBRID.64 node: the Smash emblem in flames on black, with a red 64 -->
  <g transform="translate(556 432) scale(3.5)" filter="url(#glow)">
    <rect x="-19" y="-19" width="38" height="38" rx="5" fill="#0a0a0a" stroke="#2f8bff" stroke-width="1.4"/>
    <circle cx="-1" cy="-1" r="13" fill="url(#h64Fire)"/>
    <g fill="#0a0a0a">
      <rect x="-6" y="-15" width="2.6" height="28"/>
      <rect x="-15" y="2.5" width="28" height="2.6"/>
    </g>
    <text x="11" y="15.5" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="11"
          fill="#e0201a" stroke="#ffb020" stroke-width="0.7" paint-order="stroke" font-style="italic">64</text>
  </g>

  <!-- base labels -->
  <g font-family="Impact, 'Arial Black', sans-serif" font-size="34" letter-spacing="5" fill="#ffffff"
     stroke="#0d1a2a" stroke-width="6" paint-order="stroke" filter="url(#shadow)">
    <text x="-12" y="-70.2" text-anchor="middle">VANILLA</text>
    <text x="548" y="27" text-anchor="middle">M-EX</text>
    <text x="12" y="602.5" text-anchor="middle">ACE</text>
    <text x="556" y="534.5" text-anchor="middle">HYBRID.64</text>
  </g>
  <text x="-12" y="-104.2" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="24"
        font-weight="900" letter-spacing="3" fill="url(#meleeMetal)" stroke="#ffffff" stroke-width="4.8"
        paint-order="stroke">MELEE</text>
  <text x="548" y="-7" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="21"
        letter-spacing="5" fill="#41d96f" stroke="#0d1a2a" stroke-width="5" paint-order="stroke">AKANEIA</text>
</svg>
